<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Heading  -->
    <div class="heading">
      <h1>Assginment by Grid</h1>
    </div>
    <div class="container">
      <!-- Left Section -->
      <div class="box red left-red"></div>
      <div class="box white left-white"></div>

      <!-- Top Section -->
      <div class="box cyan top-cyan"></div>
      <div class="box yellow top-yellow"></div>

      <!-- Middle Section -->
      <div class="box yellow middle-yellow"></div>
      <div class="box white middle-white"></div>

      <!-- Right Section -->
      <div class="box red right-red"></div>

      <!-- Bottom Section -->
      <div class="box red bottom-red"></div>
      <div class="box cyan bottom-cyan"></div>
    </div>
  </body>
</html>
