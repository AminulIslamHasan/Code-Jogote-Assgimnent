<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Heading  -->
    <div class="heading">
        <h1 >Assginment by flex </h1>
    </div>
     <div class="container">

        <!-- Left Column -->
        <div class="left">
            <div class="box red"></div>
            <div class="box white"></div>
        </div>

        <!-- Right Column -->
        <div class="right">

            <!-- Top Row -->
            <div class="top">
                <div class="box cyan"></div>
                <div class="box yellow"></div>
            </div>

            <!-- Bottom Area -->
            <div class="bottom">

                <div class="middle-content">

                    <!-- Middle Row -->
                    <div class="middle">
                        <div class="box yellow"></div>
                        <div class="box white"></div>
                    </div>

                    <!-- Bottom Row -->
                    <div class="bottom-row">
                        <div class="box red"></div>
                        <div class="box cyan"></div>
                    </div>

                </div>

                <!-- Right Red Box -->
                <div class="box red right-red"></div>

            </div>

        </div>

    </div>

</body>
</html>
</body>
</html>
